name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - run: npm ci

      - name: Build the website
        run: npm run build

      - name: Translation status
        run: npm run translations

      - name: Run every program in every language
        run: npm test -- --require-all
